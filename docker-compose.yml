services:
  app:
    build: .
    container_name: whatsapp-scheduler
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TZ: UTC
      DATABASE_PATH: /app/storage/db/database.sqlite
      MEDIA_PATH: /app/storage/media
      AUTH_PATH: /app/storage/auth
    ports:
      - '3000:3000'
    volumes:
      - db:/app/storage/db
      - media:/app/storage/media
      - auth:/app/storage/auth
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Perfil opcional para HTTPS automático (Basic Auth exige TLS).
  # Uso: docker compose --profile tls up -d --build
  caddy:
    image: caddy:2-alpine
    container_name: whatsapp-scheduler-caddy
    restart: unless-stopped
    profiles: ['tls']
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db:
  media:
  auth:
  caddy-data:
  caddy-config:
